version: "3.9"

services:
  db:
    image: postgres:16-alpine
    env_file:
      - .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASS}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "${POSTGRES_PORT}:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      timeout: 20s
      retries: 10

  bot:
    image: techybot:latest
    depends_on:
      db:
        condition: service_healthy
    env_file:
      - .env
    environment:
      HTTP_PROXY: http://proxy:2080
      HTTPS_PROXY: http://proxy:2080
      POSTGRES_HOST: db
    volumes:
      - ./notifs.json:/app/notifs.json
      - ./qr:/app/qr
      - ./backup:/app/backup
    # ports:
    # - "${SUB_PORT}:${SUB_PORT}"
    restart: unless-stopped

